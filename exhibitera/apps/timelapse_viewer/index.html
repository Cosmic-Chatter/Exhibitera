<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="">
    <meta name="author" content="Morgan Rehnberg">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="theme-color" content="#000000">
    
    <link rel=icon href="/_static/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/_static/manifest.json" />

    <title>Exhibitera Timelapse Viewer</title>

    <link rel="stylesheet" href="/css/bootstrap_5_3/bootstrap.min.css">
    <link rel="stylesheet" href="/css/exhibitera-common.css">
    <link rel="stylesheet" href="timelapse_viewer.css">
  </head>

  <body  oncontextmenu="return false">
    <div id="helperConnectionWarning" class="position-fixed row w-100" style="display: none; z-index:999;">
      <div class="alert alert-danger col-auto mx-auto" role="alert">
        <center>
          <H4>Error: Cannot connect to System Helper!</H4>
          Make sure the helper is running at <span id='helperConnectionWarningAddress'></span> and then restart Time-Lapse Viewer
        </center>
      </div>
    </div>

    <div id="attractor" class="align-items-center justify-content-center">
      Attractor Text
    </div>

    <div id='imageContainer'>
      <img id='img1' class="fullscreenImage" draggable="false"></img>
      <img id='img2' class="fullscreenImage" draggable="false"></img>
    </div>

    <div id="handContainer">
      <img id="hand" src="../_static/icons/hand.svg"></img>
    </div>

  <script src="../js/bootstrap_5_3/bootstrap.min.js"></script>
  <script src="../js/platform.js"></script>
  <script type="text/javascript" src="../js/html2canvas.min.js"></script>
  <script type="module" src="timelapse_viewer.js"></script>
  </body>
</html>
